name: pages

# The console, published.
#
# It is a static page that talks to Creditcoin from the visitor's own browser, so hosting it needs
# nothing but somewhere to put three files. This builds them from the artifacts of the commit being
# published — the ABIs come out of `forge build` and the addresses out of the deployment record —
# rather than from whatever happened to be in the tree when someone last remembered to rebuild.
#
# Nothing secret is involved and nothing is deployed on-chain. The published page holds no key.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and let a run in flight finish: a half-published console is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.0

      - run: npm ci

      # The ABIs the page carries are the ones this commit compiles to. That is the whole reason
      # this is a build step rather than a committed folder.
      - name: build artifacts
        run: forge build

      - name: build the console
        run: npm run web:static

      # Vercel serves the canonical copy, so it cannot be the one a human remembers to update. Both
      # hosts publish the same `web/static` from the same commit, in the same run, or the address
      # the page gives out drifts behind the address that merely mirrors it.
      #
      # The project and org ids are identifiers rather than credentials, so they sit here where they
      # can be read; only the token is a secret. Without that secret the step is skipped and the run
      # is still green — a fork should not fail this workflow over a deployment it cannot make —
      # which does mean a missing token shows up as a stale site rather than as a red build. The
      # smoke test in watch.yml is what catches that: it reads the published page hourly.
      - name: publish to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NdlwQPgRp4Fn2WzyuKh1BLB2
          VERCEL_PROJECT_ID: prj_ax7c7Tmvo59dozvBUZRo8nxZYFPS
        if: env.VERCEL_TOKEN != ''
        # Not allowed to take the mirror down with it. A missing token was already survivable; a
        # quota was not, and Vercel's free tier stops at 100 deployments a day — so a busy day
        # ended with the Vercel step failing *before* the Pages upload, leaving both hosts on the
        # previous build and the run red for a reason that is nobody's bug. Degrading to "Vercel
        # is stale, Pages is current" is the honest outcome, and watch.yml's hourly smoke of the
        # canonical URL is what notices if the staleness lasts.
        continue-on-error: true
        run: npx --yes vercel@59 deploy web/static --prod --yes --token "$VERCEL_TOKEN"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
