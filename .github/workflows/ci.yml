name: ci

# Everything here runs without a key and without CTC. The parts that need either — the demos, the
# live suite — cannot run in CI on a public repo without handing a funded account to anyone who
# opens a pull request, so they stay manual and the README says which they are.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily, so a dead endpoint or a changed precompile surfaces on its own.
    - cron: '17 6 * * *'

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # EvmV1Decoder is a Solidity dependency that arrives through npm, and foundry.toml lists
      # node_modules as a lib directory. Without this the compiler cannot find it and every
      # contract fails to parse.
      - name: solidity dependencies
        run: npm ci

      - name: formatting
        run: forge fmt --check

      - name: build
        run: forge build --sizes

      - name: tests
        run: forge test -vv

      # Fuzz tests are excluded rather than tolerated. Their mean gas moves with the seed, and a
      # seed pinned to make the gate deterministic would mean CI draws the same inputs forever —
      # trading away the point of fuzzing to stabilise a gas number. Without them the figures are
      # deterministic, and the 5% left is for compiler and toolchain drift, far below what any
      # real regression costs on a path that spends hundreds of thousands of gas.
      - name: gas snapshot
        run: forge snapshot --check --tolerance 5 --no-match-test "testFuzz" || (echo "::error::gas moved more than 5% — run 'forge snapshot --no-match-test testFuzz' and commit .gas-snapshot" && exit 1)

  offchain:
    name: offchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: npm ci

      # The scripts read ABIs out of forge's artifacts, so they need a build before they typecheck.
      - name: build artifacts
        run: forge build

      - name: typecheck
        run: npx tsc --noEmit -p tsconfig.json

  analysis:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: crytic/slither-action@v0.4.1
        with:
          fail-on: medium
          slither-args: --filter-paths "node_modules|lib" --exclude-dependencies

  live:
    # A daily check that the chain still behaves the way this is built on. It proves real Ethereum
    # mainnet transactions against the live Block Prover precompile through eth_call — no key, no
    # CTC, nothing written. When it goes red, either an endpoint died or Attestcoin changed, and
    # both are things worth finding out from a notification rather than from a failed demo.
    name: live precompile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: npm ci
      - run: forge build
      - name: verify real mainnet events against 0x0FD2
        run: npm run probe

      # Also keyless: both read the chain and neither writes to it. `provers` is the one that
      # would catch the hosted Proof Builder and the local path drifting apart, which is the whole
      # basis for claiming refutation does not depend on a hosted service.
      - name: hosted and local proofs still agree
        run: npm run provers

      - name: what the registry has cost
        run: npm run gas
