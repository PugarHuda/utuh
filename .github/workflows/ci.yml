name: ci

# Everything here runs without a key and without CTC. The parts that need either — the demos, the
# live suite — cannot run in CI on a public repo without handing a funded account to anyone who
# opens a pull request, so they stay manual and the README says which they are.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily, so a dead endpoint or a changed precompile surfaces on its own.
    - cron: '17 6 * * *'

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned, not `stable`. 1.8.0 promoted a set of lints from note to warning and the build went
      # red on a push that changed no Solidity. A toolchain that moves under the repository is a
      # review that happens on its own schedule; bumping this line is where that review belongs.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # EvmV1Decoder is a Solidity dependency that arrives through npm, and foundry.toml lists
      # node_modules as a lib directory. Without this the compiler cannot find it and every
      # contract fails to parse.
      - name: solidity dependencies
        run: npm ci

      - name: formatting
        run: forge fmt --check

      # The codebase already carried `forge-lint: disable-next-line` directives before anything ran
      # the linter, which is a suppression nobody had checked. src/ only: a truncating cast in a
      # test is a matter of how the test was written, not a property of what ships.
      - name: lint
        run: |
          forge lint src/ 2>&1 | tee lint.txt
          if grep -qE '^(warning|error)\[' lint.txt; then echo "::error::forge lint found something in src/"; exit 1; fi

      - name: build
        run: forge build --sizes

      - name: tests
        run: forge test -vv

      # Fuzz tests are excluded rather than tolerated. Their mean gas moves with the seed, and a
      # seed pinned to make the gate deterministic would mean CI draws the same inputs forever —
      # trading away the point of fuzzing to stabilise a gas number. Without them the figures are
      # deterministic, and the 5% left is for compiler and toolchain drift, far below what any
      # real regression costs on a path that spends hundreds of thousands of gas.
      - name: gas snapshot
        run: forge snapshot --check --tolerance 5 --no-match-test "testFuzz" || (echo "::error::the gas snapshot is out of date — either gas moved more than 5%, or a test was added without regenerating it. Run 'forge snapshot --no-match-test testFuzz' and commit .gas-snapshot" && exit 1)

  offchain:
    name: offchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.0

      - run: npm ci

      # The scripts read ABIs out of forge's artifacts, so they need a build before they typecheck.
      - name: build artifacts
        run: forge build

      - name: formatting
        run: npx prettier --check "offchain/**/*.ts"

      - name: typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Unused files, exports and dependencies. @gluwa/usc-contracts is ignored because it is
      # imported from Solidity, which a TypeScript analyser cannot see.
      - name: dead code
        run: npx knip

  console:
    # The web console, driven by a real browser against the live CC3 testnet.
    #
    # It runs on every push rather than on the schedule the other live jobs use, because it is the
    # product surface: a change that breaks the page should not wait until tomorrow morning to say
    # so. The cost is that a public RPC having a bad minute reads as a red build, which is why the
    # Playwright config retries once in CI and why the assertions are about invariants — the chain
    # id, the claim count, the shape of a status — rather than about any particular claim.
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.0

      - run: npm ci

      # The console reads its ABIs out of forge's artifacts, so there has to be a build first.
      - name: build artifacts
        run: forge build

      - name: browser
        run: npx playwright install --with-deps chromium

      - name: console tests
        run: npm run web:test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  analysis:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: crytic/slither-action@v0.4.1
        with:
          fail-on: medium
          slither-args: --filter-paths "node_modules|lib" --exclude-dependencies

  symbolic:
    # Its own job: crytic/slither-action runs in a container as root and leaves a node_modules
    # behind that a later `npm ci` in the same job cannot remove (EACCES on node_modules/.bin).
    #
    # `forge test` fuzzes the ordering key with 256 draws a run; halmos explores the whole input
    # space and either returns a counterexample or proves there is none. Refutation is a binary
    # search over strictly ascending keys, so a collision — or an order that disagreed with
    # chronology — would let a claim appear to contain an event it does not hold.
    name: symbolic proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: prove the ordering key
        run: |
          pip install halmos
          halmos --contract EventScopeKeySymbolic

      # The rounding proofs divide, and 256-bit division is what the solver finds hard — minutes
      # rather than seconds, and narrowing the input does not help because the division happens at
      # full width regardless. They run on the daily schedule, where minutes are affordable, rather
      # than on every push.
      - name: prove the roundings
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: halmos --contract CreditRoundingSymbolic --solver-timeout-assertion 600000

  live:
    # A daily check that the chain still behaves the way this is built on. It proves real Ethereum
    # mainnet transactions against the live Block Prover precompile through eth_call — no key, no
    # CTC, nothing written. When it goes red, either an endpoint died or Attestcoin changed, and
    # both are things worth finding out from a notification rather than from a failed demo.
    name: live precompile
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.0

      - run: npm ci
      - run: forge build
      - name: verify real mainnet events against 0x0FD2
        run: npm run probe

      # Also keyless: both read the chain and neither writes to it. `provers` is the one that
      # would catch the hosted Proof Builder and the local path drifting apart, which is the whole
      # basis for claiming refutation does not depend on a hosted service.
      - name: hosted and local proofs still agree
        run: npm run provers

      - name: what the registry has cost
        run: npm run gas
