name: watch

# A watcher that is always on, with nothing to steal.
#
# "A page open in a tab is not a daemon" — the README says so under Known limits, and it is true:
# the console makes refuting available to anyone, and makes nobody do it. This is the smallest
# thing that does it without being paid. Every hour it sweeps both published registries the way the
# daemon and the console do, and if a sealed claim is short of an event the run goes red.
#
# It holds no key. A dry run reads and never signs, so a public repository can run it with nothing
# in its secrets, and a red run is the alert: somebody sealed a lie and nobody has taken the bond
# yet. Anyone reading that alert, with a key and a few minutes, is paid half the bond to act on it.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        registry:
          - name: sepolia-sourced
            address: '0x26880c8980Cd54827543bD34c6c613253c69347b'
          - name: mainnet-sourced
            address: '0x8FA0BD5301D998Be873E31453E53d114929a5Fac'
    name: ${{ matrix.registry.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.8.0

      - run: npm ci
      - run: forge build

      # Sweeps everything sealed in the last WATCH_LOOKBACK blocks. Hourly runs and a 5,000-block
      # lookback overlap by a wide margin, so a claim sealed between two runs is seen by the next.
      - name: sweep
        env:
          REGISTRY: ${{ matrix.registry.address }}
          WATCH_STATE: .watch-${{ matrix.registry.name }}.json
        run: npm run watch -- --once --dry
