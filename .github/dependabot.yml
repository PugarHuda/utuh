# Two kinds of pinned things move under this repository: npm packages and the actions the
# workflows run. Both are pinned on purpose, and a pin nobody revisits is a vulnerability with a
# comment on it. Weekly pull requests are the revisit. Foundry is pinned by hand in each workflow
# and stays that way — see the comment in ci.yml — because its bumps have changed what the gates
# measure, and that is a review, not a merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 0.2.0 (2026-08-17) moved EvmV1Decoder to contracts/write-ability/common and made its
      # functions internal. The deployed contracts link the 0.1.2 library at the address in the
      # deployment records, and Sourcify's full match is against that source: bumping this is a
      # redeploy of every contract and a re-verification, not a merge. It gets revisited by hand,
      # with `npm run full`, and the gas fit redone — internal decoding drops the DELEGATECALL
      # from every append, which is the reason to do it and the reason not to do it by accident.
      - dependency-name: '@gluwa/usc-contracts'
    groups:
      dev-tooling:
        patterns: ['prettier', 'knip', 'typescript', 'tsx', 'esbuild', '@playwright/*', '@axe-core/*', '@types/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
