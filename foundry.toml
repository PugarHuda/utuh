[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# test/fixtures holds real proven transaction bytes captured from Sepolia — see
# ControlTransactionTest. This was dead config once, removed, and is live again now that it is used.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
via_ir = false

[rpc_endpoints]
cc3 = "https://rpc.cc3-testnet.creditcoin.network"

# forge 1.8.0 promoted a set of lints from note to warning, and CI's `stable` picked them up on a
# Thursday. Each one below is off because it fires on something this codebase does on purpose and
# has already reasoned about — in a comment next to the code, and for the overlapping detectors in
# slither.config.json. None of them is off because it was inconvenient.
#
# The sources are not touched to satisfy a linter, deliberately: every published contract is a
# full match on Sourcify against this exact tree, and a comment changes the metadata hash.
[lint]
exclude_lints = [
  # Both loops are bounded by what was configured at deployment — MAX_BATCH is 10, and the
  # clean-spec and peer lists are set once in the constructor. Reverting inside them is the point:
  # one bad proof rejects the batch, one standing default refuses the line.
  "require-revert-in-loop",
  "calls-loop",
  # `return (false, address(0))` from a parser is an ok-flag, which is exactly what a boolean
  # constant in a return tuple is for.
  "boolean-cst",
  # `_pay` and `settle` send to msg.sender or to a payee the caller named and cannot make anyone
  # else's; each site sets its state first. Same finding, same reasoning, as Slither's.
  "arbitrary-send-eth",
  # Events after a call to 0x0FD2. The precompile is a runtime native with no bytecode and cannot
  # call back into the EVM; the one real external call, `_pay`, comes last.
  "reentrancy-events",
  # `available` is liquidity, not an access-control flag, and both writes to it already emit —
  # Funded and Withdrawn. The rule wants an event naming the variable, which would be a third.
  "missing-events-access-control",
  # Every flagged cast is `uint64(block.number)`, which truncates after 1.8e19 blocks. The
  # truncations that *are* deliberate — a bytes12 tag out of a word — carry their own inline
  # disable and a sentence saying why, and those stay.
  "unsafe-typecast",
]
